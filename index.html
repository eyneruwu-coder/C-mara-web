<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cámara</title>
  <meta name="description" content="Cámara web instalable: fotos, video y ajustes, directo desde el navegador.">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cámara">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Si algo falla al iniciar (por ejemplo en un navegador muy viejo), lo muestra en pantalla.
    window.addEventListener("error", function (e) {
      if (window.__camReady) return;
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:#0E1013;color:#ECEFF4;padding:24px;font:16px/1.5 sans-serif;overflow:auto";
      d.textContent = "Error al iniciar: " + (e.message || "desconocido") + " (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")";
      document.body.appendChild(d);
    });
  </script>
</head>
<body>

<!-- Iconos SVG -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1.5 14h5M9.5 8h5M17.5 16h5"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15.3-6.4L3 8M3 3v5h5M3 12a9 9 0 0 0 15.3 6.4L21 16M16 16h5v5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-chevron-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- Vista previa -->
  <div id="viewfinder">
    <video id="video" playsinline muted autoplay></video>
    <div id="grid" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <div id="countdown" hidden aria-live="assertive"></div>
  </div>

  <!-- Barra superior -->
  <header class="top">
    <button id="btnTorch" class="ibtn" aria-label="Linterna" aria-pressed="false" hidden>
      <svg class="ic"><use href="#i-bolt"/></svg>
    </button>
    <button id="btnTimer" class="ibtn wide" aria-label="Temporizador: desactivado">
      <svg class="ic"><use href="#i-timer"/></svg><span id="timerLabel"></span>
    </button>
    <div id="recPill" class="pill" hidden><i></i><span id="recTime">00:00</span></div>
    <span class="spacer"></span>
    <button id="btnGrid" class="ibtn" aria-label="Cuadrícula" aria-pressed="false">
      <svg class="ic"><use href="#i-grid"/></svg>
    </button>
    <button id="btnSettings" class="ibtn" aria-label="Ajustes">
      <svg class="ic"><use href="#i-sliders"/></svg>
    </button>
  </header>

  <div id="info" aria-hidden="true"></div>

  <!-- Barra inferior -->
  <footer class="bottom">
    <div class="modes" role="tablist" aria-label="Modo">
      <button role="tab" data-mode="photo" aria-selected="true">Foto</button>
      <button role="tab" data-mode="video" aria-selected="false">Video</button>
    </div>
    <div class="controls">
      <div class="side left">
        <button id="btnGallery" class="thumb" aria-label="Abrir galería">
          <svg class="ic"><use href="#i-image"/></svg>
        </button>
      </div>
      <button id="shutter" aria-label="Tomar foto"><span></span></button>
      <div class="side right">
        <button id="btnPause" class="ibtn big" aria-label="Pausar grabación" hidden>
          <svg class="ic"><use href="#i-pause"/></svg>
        </button>
        <button id="btnFlip" class="ibtn big" aria-label="Cambiar de cámara">
          <svg class="ic"><use href="#i-flip"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Mensajes de error / permisos -->
  <section id="msg" hidden>
    <div class="msg-card">
      <h1 id="msgTitle"></h1>
      <p id="msgText"></p>
      <button id="msgBtn" class="btn primary">Intentar de nuevo</button>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- Ajustes -->
<dialog id="sheet" aria-label="Ajustes">
  <div class="sheet-head">
    <h2>Ajustes</h2>
    <button class="ibtn flat" data-close aria-label="Cerrar ajustes"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="sheet-body">

    <h3>Cámara</h3>
    <label class="row"><span>Cámara</span>
      <select id="selDevice"></select></label>
    <label class="row"><span>Resolución</span>
      <select data-setting="resolution">
        <option value="auto">Automática</option>
        <option value="720">HD 720p</option>
        <option value="1080">Full HD 1080p</option>
        <option value="2160">4K</option>
      </select></label>

    <h3>Foto</h3>
    <label class="row"><span>Formato</span>
      <select data-setting="photoFormat">
        <option value="image/jpeg">JPEG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select></label>
    <label class="row"><span>Calidad <output id="outQuality"></output></span>
      <input type="range" min="50" max="100" step="1" data-setting="quality"></label>
    <label class="row"><span>Temporizador</span>
      <select data-setting="timer" data-num>
        <option value="0">Desactivado</option>
        <option value="3">3 segundos</option>
        <option value="5">5 segundos</option>
        <option value="10">10 segundos</option>
      </select></label>

    <h3>Video</h3>
    <label class="row"><span>Grabar sonido</span>
      <input type="checkbox" class="switch" data-setting="mic"></label>

    <h3>Vista y archivos</h3>
    <label class="row"><span>Cuadrícula</span>
      <input type="checkbox" class="switch" data-setting="grid"></label>
    <label class="row"><span>Reflejar vista previa</span>
      <select data-setting="mirror">
        <option value="auto">Automático</option>
        <option value="on">Sí</option>
        <option value="off">No</option>
      </select></label>
    <label class="row"><span>Guardar foto reflejada</span>
      <input type="checkbox" class="switch" data-setting="saveMirrored"></label>
    <label class="row"><span>Sonido del obturador</span>
      <input type="checkbox" class="switch" data-setting="sound"></label>
    <label class="row"><span>Descargar al capturar<small>Guarda también una copia en el teléfono</small></span>
      <input type="checkbox" class="switch" data-setting="autoDownload"></label>

    <h3 id="advTitle" hidden>Controles de la cámara</h3>
    <div id="adv"></div>
    <div class="row" id="advReset" hidden>
      <span></span><button id="btnResetAdv" class="btn">Restablecer controles</button>
    </div>

    <h3>Aplicación</h3>
    <div class="row" id="installRow">
      <span id="installText">Instala la cámara para abrirla como una app.</span>
      <button id="btnInstall" class="btn primary" hidden>Instalar</button>
    </div>
  </div>
</dialog>

<!-- Galería -->
<dialog id="gallery" aria-label="Galería" class="full">
  <div class="bar">
    <button class="ibtn flat" data-close aria-label="Cerrar galería"><svg class="ic"><use href="#i-close"/></svg></button>
    <h2>Galería <span id="galCount"></span></h2>
  </div>
  <div id="galGrid"></div>
  <p id="galEmpty" hidden>Aún no hay fotos ni videos.<br>Lo que captures aparecerá aquí.</p>
</dialog>

<!-- Visor -->
<dialog id="viewer" aria-label="Visor" class="full dark">
  <div class="bar over">
    <button class="ibtn" data-close aria-label="Cerrar visor"><svg class="ic"><use href="#i-close"/></svg></button>
    <span id="viewCount"></span>
  </div>
  <div id="viewStage"><div id="viewTrack"></div></div>
  <div class="actions">
    <button id="actSave" class="act"><svg class="ic"><use href="#i-download"/></svg>Guardar</button>
    <button id="actShare" class="act"><svg class="ic"><use href="#i-share"/></svg>Compartir</button>
    <button id="actDelete" class="act danger"><svg class="ic"><use href="#i-trash"/></svg><span>Eliminar</span></button>
  </div>
</dialog>

<canvas id="canvas" hidden></canvas>
<script src="app.js"></script>
</body>
</html>
